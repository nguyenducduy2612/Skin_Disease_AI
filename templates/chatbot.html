<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkinAI - Chatbot Tư Vấn Da Liễu</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
    <script defer src="{{ url_for('static', filename='js/chat.js') }}"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            min-height: 100vh;
            background: #f2f6fc;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: #003366;
            color: #ffffff;
            height: 100vh;
            position: fixed;
            display: flex;
            flex-direction: column;
            padding: 20px;
            transition: width 0.3s;
        }

        .sidebar .logo {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .sidebar .logo img {
            width: 200px;
            height: 200px;
            margin-right: 20px;
            border: none;
        }

        .sidebar .app-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            padding: 10px;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .sidebar a:hover {
            background: #ff9933;
            transform: translateX(5px);
        }

        .sidebar a.active {
            background: #ff6600;
        }

        .sidebar a img {
            width: 30px;
            height: 30px;
            margin-right: 10px;
            vertical-align: middle;
            border: none;
        }

        .sidebar a span {
            margin-left: 10px;
            transition: opacity 0.3s;
        }

        /* Responsive sidebar */
        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
            }
            .sidebar .app-name,
            .sidebar a span {
                opacity: 0;
                display: none;
            }
            .sidebar a {
                justify-content: center;
            }
            .sidebar a img {
                margin-right: 0;
                border: none;
            }
            .sidebar .logo img {
                width: 32px;
                height: 32px;
                margin-right: 0;
                border: none;
            }
        }

        /* Main content */
        .main-content {
            margin-left: {{ '250px' if current_user.is_authenticated else '0' }};
            flex-grow: 1;
            padding: 40px;
            background: #f2f6fc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        /* Chat container */
        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 80vh;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: fadeIn 0.5s ease-in;
        }

        .chat-header {
            background: #ff6600;
            color: #ffffff;
            padding: 15px 20px;
            text-align: center;
            font-weight: 600;
            font-size: 1.4rem;
        }

        .chat-header img {
            width: 30px;
            height: 30px;
            vertical-align: middle;
            margin-right: 8px;
            border: none;
        }

        #chat-box {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            background: #ffffff;
        }

        .user-msg p {
            background: #003366;
            color: #ffffff;
            padding: 14px 18px;
            border-radius: 12px;
            margin: 10px;
            text-align: right;
            max-width: 70%;
            margin-left: auto;
            font-size: 1rem;
            animation: fadeInScale 0.3s ease-in;
        }

        .ai-msg p {
            background: #e6f0ff;
            color: #333;
            padding: 14px 18px;
            border-radius: 12px;
            margin: 10px;
            text-align: left;
            max-width: 70%;
            margin-right: auto;
            font-size: 1rem;
            animation: fadeInScale 0.3s ease-in;
        }

        .chat-input {
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid #ddd;
            padding: 14px 20px;
            background: #f9fbff;
        }

        #chat-input {
            flex: 1;
            padding: 14px 18px;
            font-size: 1rem;
            border: 1.5px solid #ccd6e0;
            border-radius: 30px;
            outline: none;
            transition: all 0.3s ease;
            background: #ffffff;
        }

        #chat-input:focus {
            border-color: #ff6600;
            box-shadow: 0 0 5px rgba(255, 102, 0, 0.3);
        }

        #send-btn {
            background: #ff6600;
            color: #ffffff;
            border: none;
            padding: 14px 26px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #send-btn:hover {
            background: #003366;
            transform: scale(1.05);
        }

        /* Back button */
        .back-btn {
            display: inline-block;
            background: #003366;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            margin-top: 25px;
            font-size: 1rem;
            transition: background 0.3s;
        }

        .back-btn:hover {
            background: #ff6600;
        }

        .back-btn img {
            width: 24px;
            height: 24px;
            vertical-align: middle;
            margin-right: 8px;
            border: none;
        }

        /* Footer */
        footer {
            text-align: center;
            color: #666;
            font-size: 0.8rem;
            margin-top: 15px;
            padding: 10px 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <!-- Sidebar (chỉ hiển thị khi đã đăng nhập) -->
    {% if current_user.is_authenticated %}
    <div class="sidebar">
        <div class="logo">
            <img src="/static/images/stethoscope-icon.png" alt="Stethoscope Logo">
        </div>
        <div class="app-name">SKIN DISEASE AI</div>
        <a href="{{ url_for('index') }}">
            <img src="/static/images/home-icon.png" alt="Home Icon">
            <span>Trang chủ</span>
        </a>
        <a href="{{ url_for('history') }}">
            <img src="/static/images/history-icon.png" alt="History Icon">
            <span>Lịch sử chẩn đoán</span>
        </a>
        <a href="{{ url_for('chatbot') }}" class="active">
            <img src="/static/images/chatbot-icon.png" alt="Chatbot Icon">
            <span>Chatbot</span>
        </a>
        <a href="{{ url_for('logout') }}">
            <img src="/static/images/logout-icon.png" alt="Logout Icon">
            <span>Đăng xuất</span>
        </a>
    </div>
    {% endif %}

    <!-- Main content -->
    <div class="main-content">
        <div class="chat-container">
            <div class="chat-header">
                <img src="/static/images/chatbot-icon.png" alt="Chatbot Icon">
                Chatbot Tư Vấn Da Liễu
            </div>
            <div id="chat-box"></div>
            <div class="chat-input">
                <input id="chat-input" type="text" placeholder="Nhập câu hỏi của bạn..." />
                <button id="send-btn">Gửi</button>
            </div>
        </div>
        <a href="{{ url_for('index') }}" class="back-btn">
            <img src="/static/images/back-icon.png" alt="Back Icon">
            Quay lại trang chính
        </a>
        <footer>© 2025 SkinAI Team</footer>
    </div>
</body>
</html>
